<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Stats Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0820;
    --bg2: #140a30;
    --panel: rgba(28, 18, 60, .72);
    --panel-2: #1d1442;
    --border: #3a2a78;
    --text: #f4f0ff;
    --muted: #a99cd8;
    --dim: #6b5ca8;
    --accent: #18e0ff;   /* electric blue  - team A / primary */
    --c2: #ff3d8b;       /* hot magenta    - team B          */
    --win: #2bff95;      /* neon green */
    --loss: #ff5470;     /* neon red   */
    --gold: #ffd23f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(24,224,255,.08), transparent 60%),
      radial-gradient(900px 500px at 88% -8%, rgba(255,61,139,.08), transparent 60%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg) 55%);
    background-attachment: fixed;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 26px 18px 64px; position: relative; }

  /* ---- title marquee ---- */
  header { text-align: center; margin-bottom: 8px; }
  header h1 {
    margin: 0; font-family: "Bungee", sans-serif; font-weight: 400;
    font-size: clamp(1.9rem, 6.5vw, 3.3rem); line-height: .95; letter-spacing: .01em;
    color: #fff; text-shadow: 0 2px 0 #07051a;
  }
  header h1 .ball { color: var(--gold); }
  header h1 .vs { color: var(--c2); }
  .sub {
    margin: 12px 0 0; font-family: "Bungee", sans-serif; font-size: .68rem;
    letter-spacing: .2em; color: var(--muted); text-transform: uppercase;
  }

  /* ---- control deck ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; margin: 26px 0 20px; }
  .modes, .pills { display: flex; gap: 8px; }
  .modes button, .pills button {
    border: 2px solid var(--border); background: var(--panel-2); color: var(--muted);
    font-family: "Bungee", sans-serif; font-size: .72rem; letter-spacing: .04em;
    padding: 11px 18px; cursor: pointer; transition: all .15s ease;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .pills button { font-size: .62rem; padding: 9px 13px; }
  .modes button:hover, .pills button:hover { color: var(--text); border-color: var(--accent); }
  .modes button.on {
    background: var(--accent); color: #04141a; border-color: var(--accent); transform: translateY(-1px);
  }
  .pills button.on {
    background: var(--gold); color: #2a1d00; border-color: var(--gold);
  }
  .selects { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  select {
    appearance: none; background: var(--panel-2); color: var(--text);
    border: 2px solid var(--border); border-radius: 0; padding: 10px 30px 10px 14px;
    font-family: "Inter", sans-serif; font-weight: 700; font-size: .9rem; cursor: pointer;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 16px) center, calc(100% - 11px) center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  select:focus { outline: none; border-color: var(--accent); }
  select.p1 { border-color: var(--accent); }
  select.p2 { border-color: var(--c2); }
  .vsmini { font-family: "Bungee", sans-serif; color: var(--c2); font-size: 1rem; }

  /* ---- HUD stat cards ---- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
  .card {
    background: var(--panel); border: 2px solid var(--border); padding: 14px 16px 13px; position: relative;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    opacity: 0; transform: translateY(14px) scale(.97); transition: opacity .4s ease, transform .4s cubic-bezier(.2,.9,.3,1.3);
  }
  .card.in { opacity: 1; transform: none; }
  .card::after { content: ""; position: absolute; top: 0; left: 0; width: 36px; height: 3px; background: var(--accent); }
  .card .k { color: var(--muted); font-family: "Bungee", sans-serif; font-size: .58rem; letter-spacing: .1em; text-transform: uppercase; }
  .card .v { font-size: 1.7rem; font-weight: 900; margin-top: 6px; font-variant-numeric: tabular-nums; }

  /* ---- panels ---- */
  .panel {
    background: var(--panel); border: 2px solid var(--border); padding: 16px 18px; margin: 14px 0;
    clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  }
  .panel h2 {
    margin: 0 0 4px; font-family: "Bungee", sans-serif; font-size: .95rem; letter-spacing: .02em;
    text-transform: uppercase; display: flex; align-items: center; gap: 10px;
  }
  .panel h2::before { content: ""; width: 5px; height: 17px; background: var(--accent); }
  .panel .note { color: var(--muted); font-size: .82rem; margin: 0 0 12px; }
  .legend { display: flex; gap: 18px; font-size: .8rem; color: var(--muted); margin-bottom: 10px; flex-wrap: wrap; font-weight: 700; }
  .legend i { display: inline-block; width: 11px; height: 11px; margin-right: 7px; vertical-align: -1px; }

  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--dim); font-size: 11px; font-family: "Inter", sans-serif; font-weight: 700; }
  svg .grid { stroke: var(--border); stroke-width: 1; opacity: .5; }
  svg path.line { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  svg circle.dot { opacity: 0; transition: opacity .3s ease; }
  svg rect.bar { transform: scaleY(0); transform-origin: center bottom; transform-box: fill-box;
    transition: transform .5s cubic-bezier(.2,.8,.3,1); }
  svg rect.bar.grow { transform: scaleY(1); }

  /* ---- VS matchup banner ---- */
  .matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px;
    margin: 6px 0 18px; }
  .matchup .team { font-family: "Bungee", sans-serif; font-size: clamp(.9rem, 2.4vw, 1.4rem); line-height: 1.05; }
  .matchup .p1 { text-align: right; color: var(--accent); }
  .matchup .p2 { text-align: left; color: var(--c2); }
  .matchup .vsbadge {
    font-family: "Bungee", sans-serif; font-size: 1.4rem; color: #fff; width: 58px; height: 58px;
    display: grid; place-items: center; background: var(--panel-2); border: 2px solid var(--c2);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
  }

  /* ---- head-to-head power bars ---- */
  .cmp-row { display: grid; grid-template-columns: 64px 1fr 150px 1fr 64px; gap: 10px; align-items: center; margin: 11px 0; }
  .cmp-row .name { text-align: center; color: var(--muted); font-family: "Bungee", sans-serif; font-size: .58rem; letter-spacing: .06em; text-transform: uppercase; }
  .cmp-row .val { font-weight: 900; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .cmp-row .val.r { text-align: right; }
  .track { background: #0c0726; border: 2px solid var(--border); height: 16px; overflow: hidden;
    clip-path: polygon(6px 0, 100% 0, 100% 100%, 0 100%, 0 6px); }
  .track.left { transform: scaleX(-1); clip-path: polygon(0 0, 100% 0, 100% 100%, 6px 100%, 0 calc(100% - 6px)); }
  .track .fill { height: 100%; width: 0; transition: width .9s cubic-bezier(.2,.8,.3,1); }

  .msg { text-align: center; color: var(--muted); padding: 60px 20px; font-family: "Bungee", sans-serif; font-size: .9rem; }

  footer { color: var(--muted); font-size: .82rem; text-align: center; margin-top: 30px; font-weight: 600; }
  footer a { color: var(--accent); text-decoration: none; font-weight: 800; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="ball">●</span> NBA STATS <span class="vs">ARCADE</span></h1>
    <p class="sub" id="subtitle">insert coin — loading roster…</p>
  </header>

  <div id="app" hidden>
    <div class="controls">
      <div class="modes" id="tabs">
        <button data-tab="analyze" class="on">▸ Solo</button>
        <button data-tab="compare">⚔ Versus</button>
      </div>
      <div class="pills" id="phase">
        <button data-phase="all" class="on">Season</button>
        <button data-phase="regular">Regular</button>
        <button data-phase="playoffs">Playoffs</button>
      </div>
      <div class="selects">
        <select id="teamA" class="p1"></select>
        <span class="vsmini" id="vsLabel" hidden>VS</span>
        <select id="teamB" class="p2" hidden></select>
      </div>
    </div>
    <div id="view"></div>
  </div>

  <div class="msg" id="loadError" hidden>
    GAME OVER — couldn't load data.json. Run the pipeline and serve this folder over HTTP.
  </div>

  <footer>
    stats from the <a href="https://www.balldontlie.io">BALLDONTLIE</a> API ·
    Built by <a href="https://div23.app">Divyansh Raghuvanshi</a>
  </footer>
</div>

<script>
"use strict";

let DATA = null;
let state = { tab: "analyze", phase: "all", teamA: null, teamB: null };

const $ = (sel) => document.querySelector(sel);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ------------------------------------------------------------------ */
/* Data helpers                                                       */
/* ------------------------------------------------------------------ */

function phaseGames() {
  if (state.phase === "regular") return DATA.games.filter(g => !g.postseason);
  if (state.phase === "playoffs") return DATA.games.filter(g => g.postseason);
  return DATA.games;
}

// All of one team's games, from that team's point of view.
function teamGames(team) {
  return phaseGames()
    .filter(g => g.home === team || g.away === team)
    .map(g => {
      const home = g.home === team;
      const pts = home ? g.home_score : g.away_score;
      const opp = home ? g.away_score : g.home_score;
      return { date: g.date, opponent: home ? g.away : g.home, home,
               pts, opp, win: pts > opp };
    });
}

function teamStats(team) {
  const gs = teamGames(team);
  const wins = gs.filter(g => g.win).length;
  const losses = gs.length - wins;
  const sum = (arr) => arr.reduce((a, b) => a + b, 0);
  const homeGs = gs.filter(g => g.home), awayGs = gs.filter(g => !g.home);
  let streak = 0, best = 0;
  for (const g of gs) { streak = g.win ? streak + 1 : 0; best = Math.max(best, streak); }
  const last10 = gs.slice(-10);
  return {
    games: gs, wins, losses,
    winPct: gs.length ? wins / gs.length : 0,
    homeW: homeGs.filter(g => g.win).length, homeL: homeGs.filter(g => !g.win).length,
    awayW: awayGs.filter(g => g.win).length, awayL: awayGs.filter(g => !g.win).length,
    ppg: gs.length ? sum(gs.map(g => g.pts)) / gs.length : 0,
    oppg: gs.length ? sum(gs.map(g => g.opp)) / gs.length : 0,
    bestStreak: best,
    last10W: last10.filter(g => g.win).length, last10N: last10.length,
  };
}

function cumulative(gs, pick) {
  let c = 0;
  return gs.map(g => (c += pick(g) ? 1 : 0));
}

/* ------------------------------------------------------------------ */
/* Animation helpers                                                  */
/* ------------------------------------------------------------------ */

function countUp(el, target, decimals = 0, suffix = "") {
  const dur = 900, t0 = performance.now();
  (function tick(t) {
    const k = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = (target * eased).toFixed(decimals) + suffix;
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}

function animateLines(container) {
  container.querySelectorAll("path.line").forEach((p, i) => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.getBoundingClientRect();           // force layout so the transition runs
    p.style.transition = `stroke-dashoffset 1.4s ease-out ${i * 0.2}s`;
    p.style.strokeDashoffset = 0;
  });
  container.querySelectorAll("circle.dot").forEach(c => {
    const d = parseFloat(c.dataset.delay || 0);
    setTimeout(() => { c.style.opacity = 1; }, d * 1000);
  });
}

function animateBars(container) {
  container.querySelectorAll("rect.bar").forEach((r, i) => {
    r.style.transitionDelay = Math.min(i * 12, 600) + "ms";
    requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add("grow")));
  });
}

function revealCards(container) {
  container.querySelectorAll(".card").forEach((c, i) => {
    setTimeout(() => c.classList.add("in"), 60 * i);
  });
}

/* ------------------------------------------------------------------ */
/* SVG chart builders                                                 */
/* ------------------------------------------------------------------ */

// Multi-series line chart. series = [{color, values}], x axis = game number.
function lineChartSVG(series) {
  const W = 920, H = 340, P = { l: 46, r: 14, t: 14, b: 32 };
  const maxX = Math.max(2, ...series.map(s => s.values.length));
  const maxY = Math.max(1, ...series.flatMap(s => s.values));
  const x = i => P.l + (W - P.l - P.r) * (i / (maxX - 1));
  const y = v => H - P.b - (H - P.t - P.b) * (v / maxY);

  let out = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  const yStep = Math.max(1, Math.ceil(maxY / 5));
  for (let v = 0; v <= maxY; v += yStep) {
    out += `<line class="grid" x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}"/>` +
           `<text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  const xStep = Math.max(1, Math.ceil(maxX / 10));
  for (let i = 0; i < maxX; i += xStep) {
    out += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${i + 1}</text>`;
  }
  for (const s of series) {
    const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    out += `<path class="line" stroke="${s.color}" d="M${pts.join(" L")}"/>`;
    s.values.forEach((v, i) => {
      const delay = 0.2 + 1.4 * (i / s.values.length);
      out += `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.4" fill="${s.color}" data-delay="${delay.toFixed(2)}"/>`;
    });
  }
  return out + "</svg>";
}

// Per-game point margin bars (green = win, red = loss).
function marginChartSVG(gs) {
  const W = 920, H = 260, P = { l: 46, r: 14, t: 14, b: 30 };
  const maxAbs = Math.max(6, ...gs.map(g => Math.abs(g.pts - g.opp)));
  const x = i => P.l + (W - P.l - P.r) * (i / Math.max(1, gs.length));
  const y = v => H - P.b - (H - P.t - P.b) * ((v + maxAbs) / (2 * maxAbs));
  const zero = y(0);
  const bw = Math.max(2, ((W - P.l - P.r) / Math.max(1, gs.length)) - 2);

  let out = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for (const v of [-maxAbs, 0, maxAbs]) {
    out += `<line class="grid" x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}"/>` +
           `<text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${v}</text>`;
  }
  gs.forEach((g, i) => {
    const diff = g.pts - g.opp;
    const top = diff >= 0 ? y(diff) : zero;
    const h = Math.max(1, Math.abs(zero - y(diff)));
    const color = diff >= 0 ? "var(--win)" : "var(--loss)";
    const label = `G${i + 1} ${g.home ? "vs" : "@"} ${esc(g.opponent)}: ${g.pts}-${g.opp} (${diff >= 0 ? "+" : ""}${diff})`;
    out += `<rect class="bar" x="${x(i).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${color}"><title>${label}</title></rect>`;
  });
  return out + "</svg>";
}

/* ------------------------------------------------------------------ */
/* Views                                                              */
/* ------------------------------------------------------------------ */

function renderAnalyze() {
  const team = state.teamA;
  const s = teamStats(team);
  const view = $("#view");

  if (!s.games.length) {
    view.innerHTML = `<div class="msg">No ${state.phase === "all" ? "" : state.phase + " "}games for ${esc(team)} yet.</div>`;
    return;
  }

  const cards = [
    { k: "Record", v: `${s.wins}-${s.losses}` },
    { k: "Win Rate", num: s.winPct * 100, dec: 1, suffix: "%" },
    { k: "Home", v: `${s.homeW}-${s.homeL}` },
    { k: "Away", v: `${s.awayW}-${s.awayL}` },
    { k: "Offense", num: s.ppg, dec: 1 },
    { k: "Defense", num: s.oppg, dec: 1 },
    { k: "Hot Streak", num: s.bestStreak },
    { k: `Last ${s.last10N}`, v: `${s.last10W}-${s.last10N - s.last10W}` },
  ];

  view.innerHTML = `
    <div class="cards">
      ${cards.map((c, i) => `
        <div class="card"><div class="k">${c.k}</div>
        <div class="v" id="stat${i}">${c.num === undefined ? c.v : "0"}</div></div>`).join("")}
    </div>
    <div class="panel">
      <h2>${esc(team)} — Season Run</h2>
      <p class="note">Cumulative wins and losses, game by game.</p>
      <div class="legend">
        <span><i style="background:var(--win)"></i>Wins</span>
        <span><i style="background:var(--loss)"></i>Losses</span>
      </div>
      <div id="lineChart">${lineChartSVG([
        { color: "var(--win)", values: cumulative(s.games, g => g.win) },
        { color: "var(--loss)", values: cumulative(s.games, g => !g.win) },
      ])}</div>
    </div>
    <div class="panel">
      <h2>Scoreboard — Point Margin</h2>
      <p class="note">Green bars are wins, red are losses. Hover a bar for the box score.</p>
      <div id="marginChart">${marginChartSVG(s.games)}</div>
    </div>`;

  cards.forEach((c, i) => {
    if (c.num !== undefined) countUp($(`#stat${i}`), c.num, c.dec || 0, c.suffix || "");
  });
  revealCards(view);
  animateLines($("#lineChart"));
  animateBars($("#marginChart"));
}

function renderCompare() {
  const [a, b] = [state.teamA, state.teamB];
  const sa = teamStats(a), sb = teamStats(b);
  const view = $("#view");

  if (!sa.games.length || !sb.games.length) {
    view.innerHTML = `<div class="msg">Not enough ${state.phase === "all" ? "" : state.phase + " "}games to compare these teams.</div>`;
    return;
  }

  const rows = [
    { name: "Wins", a: sa.wins, b: sb.wins },
    { name: "Win Rate", a: sa.winPct * 100, b: sb.winPct * 100, dec: 1, suffix: "%" },
    { name: "Offense", a: sa.ppg, b: sb.ppg, dec: 1 },
    { name: "Defense", a: sa.oppg, b: sb.oppg, dec: 1, lowerBetter: true },
    { name: "Home Wins", a: sa.homeW, b: sb.homeW },
    { name: "Away Wins", a: sa.awayW, b: sb.awayW },
    { name: "Hot Streak", a: sa.bestStreak, b: sb.bestStreak },
  ];

  view.innerHTML = `
    <div class="matchup">
      <div class="team p1">${esc(a)}</div>
      <div class="vsbadge">VS</div>
      <div class="team p2">${esc(b)}</div>
    </div>
    <div class="panel">
      <h2>Race to the Top — Wins</h2>
      <p class="note">Who stacked up wins faster across the season.</p>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>${esc(a)}</span>
        <span><i style="background:var(--c2)"></i>${esc(b)}</span>
      </div>
      <div id="cmpChart">${lineChartSVG([
        { color: "var(--accent)", values: cumulative(sa.games, g => g.win) },
        { color: "var(--c2)", values: cumulative(sb.games, g => g.win) },
      ])}</div>
    </div>
    <div class="panel">
      <h2>Head to Head</h2>
      <p class="note">${esc(a)} on the left, ${esc(b)} on the right. The brighter bar wins each stat.</p>
      ${rows.map((r) => {
        const max = Math.max(r.a, r.b, 0.001);
        const aWins = r.lowerBetter ? r.a <= r.b : r.a >= r.b;
        const fmt = v => v.toFixed(r.dec || 0) + (r.suffix || "");
        return `
        <div class="cmp-row">
          <div class="val" style="color:var(--accent)">${fmt(r.a)}</div>
          <div class="track left"><div class="fill" data-w="${(100 * r.a / max).toFixed(1)}"
               style="background:var(--accent);opacity:${aWins ? 1 : 0.35}"></div></div>
          <div class="name">${r.name}</div>
          <div class="track"><div class="fill" data-w="${(100 * r.b / max).toFixed(1)}"
               style="background:var(--c2);opacity:${aWins ? 0.35 : 1}"></div></div>
          <div class="val r" style="color:var(--c2)">${fmt(r.b)}</div>
        </div>`;
      }).join("")}
    </div>`;

  animateLines($("#cmpChart"));
  view.querySelectorAll(".fill").forEach((f, i) => {
    setTimeout(() => { f.style.width = f.dataset.w + "%"; }, 80 * i + 200);
  });
}

function render() {
  $("#teamB").hidden = $("#vsLabel").hidden = state.tab !== "compare";
  if (state.tab === "compare") renderCompare();
  else renderAnalyze();
}

/* ------------------------------------------------------------------ */
/* Boot                                                               */
/* ------------------------------------------------------------------ */

async function boot() {
  try {
    const resp = await fetch("data.json");
    if (!resp.ok) throw new Error(resp.statusText);
    DATA = await resp.json();
  } catch (e) {
    $("#subtitle").textContent = "no data yet.";
    $("#loadError").hidden = false;
    return;
  }

  const season = DATA.season;
  $("#subtitle").textContent =
    `${season}-${String(season + 1).slice(-2)} season · ${DATA.games.length} games · updated ${DATA.updated}`;

  for (const sel of [$("#teamA"), $("#teamB")]) {
    sel.innerHTML = DATA.teams.map(t => `<option>${esc(t)}</option>`).join("");
  }
  state.teamA = DATA.teams.includes("Los Angeles Lakers") ? "Los Angeles Lakers" : DATA.teams[0];
  state.teamB = DATA.teams.find(t => t !== state.teamA);
  $("#teamA").value = state.teamA;
  $("#teamB").value = state.teamB;

  $("#teamA").onchange = e => { state.teamA = e.target.value; render(); };
  $("#teamB").onchange = e => { state.teamB = e.target.value; render(); };
  $("#tabs").onclick = e => {
    const btn = e.target.closest("button"); if (!btn) return;
    state.tab = btn.dataset.tab;
    $("#tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
    render();
  };
  $("#phase").onclick = e => {
    const btn = e.target.closest("button"); if (!btn) return;
    state.phase = btn.dataset.phase;
    $("#phase").querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
    render();
  };

  $("#app").hidden = false;
  render();
}

boot();
</script>
</body>
</html>

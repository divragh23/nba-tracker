<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Season Tracker</title>
<style>
  :root {
    --bg: #f6f5f1;        /* warm paper */
    --panel: #ffffff;
    --ink: #1b1c1e;       /* near-black text */
    --muted: #6c6f76;     /* secondary text */
    --faint: #9a9da4;     /* axis / tertiary */
    --line: #e4e2db;      /* hairline rules */
    --accent: #2f5db0;    /* team A — slate blue */
    --c2: #c2603a;        /* team B — terracotta */
    --win: #2f7d54;       /* muted green */
    --loss: #b1483f;      /* muted red */
    --dim: #9a9da4;       /* svg axis text */
    --border: #e4e2db;    /* svg grid */
    --track: #efeee9;     /* head-to-head bar background */
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  [data-theme="dark"] {
    --bg: #16161a;
    --panel: #1e1e23;
    --ink: #eceae4;
    --muted: #9a9aa3;
    --faint: #6a6a73;
    --line: #2d2d34;
    --accent: #6f9ae0;
    --c2: #e08a5f;
    --win: #54b487;
    --loss: #db7068;
    --dim: #6a6a73;
    --border: #2d2d34;
    --track: #2a2a31;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    transition: background-color .2s ease, color .2s ease;
  }
  .wrap { max-width: 940px; margin: 0 auto; padding: 40px 22px 72px; }

  /* ---- masthead ---- */
  .masthead { display: flex; justify-content: space-between; align-items: flex-end;
    gap: 16px; padding-bottom: 16px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
  .masthead .kicker { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 4px; }
  .masthead h1 { font-family: var(--serif); font-weight: 600; font-size: 2.1rem;
    letter-spacing: -.01em; margin: 0; }
  .masthead .meta { font-size: .82rem; color: var(--muted); margin: 0; text-align: right;
    font-variant-numeric: tabular-nums; }

  /* ---- controls ---- */
  .controls { display: flex; flex-wrap: wrap; gap: 22px 28px; align-items: center;
    margin: 22px 0 30px; }
  .tabs { display: flex; gap: 22px; }
  .tabs button { border: 0; background: none; padding: 6px 0; font: inherit; font-weight: 600;
    color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s; }
  .tabs button:hover { color: var(--ink); }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--panel); }
  .seg button { border: 0; background: none; padding: 7px 14px; font: inherit; font-size: .86rem;
    color: var(--muted); cursor: pointer; border-left: 1px solid var(--line); transition: background .15s, color .15s; }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--ink); color: var(--bg); }

  .selects { display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  select { appearance: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 32px 8px 12px; font: inherit; font-weight: 500; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 17px) center, calc(100% - 12px) center; background-size: 5px 5px; background-repeat: no-repeat; }
  select:focus { outline: none; border-color: var(--ink); }
  .vsmini { font-family: var(--serif); font-style: italic; color: var(--muted); }

  /* ---- stat line ---- */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; background: var(--panel); margin: 0 0 26px; }
  .card { padding: 16px 18px; border-left: 1px solid var(--line); border-top: 1px solid var(--line);
    opacity: 0; transform: translateY(6px); transition: opacity .4s ease, transform .4s ease; }
  .card.in { opacity: 1; transform: none; }
  .card:nth-child(-n+4) { border-top: 0; }
  .card:nth-child(4n+1) { border-left: 0; }
  .card .k { color: var(--muted); font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; }
  .card .v { font-size: 1.7rem; font-weight: 650; margin-top: 5px; font-variant-numeric: tabular-nums;
    letter-spacing: -.01em; }

  /* ---- panels ---- */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px 22px; margin: 18px 0; }
  .panel h2 { font-size: 1rem; font-weight: 650; margin: 0; letter-spacing: -.01em; }
  .panel .note { color: var(--muted); font-size: .85rem; margin: 3px 0 16px; }
  .legend { display: flex; gap: 20px; font-size: .82rem; color: var(--muted); margin-bottom: 12px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 22px; height: 3px; margin-right: 8px; vertical-align: 3px; border-radius: 2px; }

  svg { width: 100%; height: auto; display: block; }
  svg text { fill: var(--dim); font-size: 11px; font-family: var(--sans); }
  svg .grid { stroke: var(--border); stroke-width: 1; }
  svg path.line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  svg circle.dot { opacity: 0; transition: opacity .3s ease; }
  svg rect.bar { transform: scaleY(0); transform-origin: center bottom; transform-box: fill-box;
    transition: transform .5s cubic-bezier(.2,.8,.3,1); }
  svg rect.bar.grow { transform: scaleY(1); }

  /* ---- compare matchup ---- */
  .matchup { display: flex; align-items: baseline; justify-content: center; gap: 14px;
    padding: 6px 0 18px; font-family: var(--serif); flex-wrap: wrap; }
  .matchup .team { font-size: 1.5rem; font-weight: 600; }
  .matchup .p1 { color: var(--accent); }
  .matchup .p2 { color: var(--c2); }
  .matchup .vs { font-style: italic; color: var(--muted); font-size: 1.1rem; }

  /* ---- head-to-head bars ---- */
  .cmp-row { display: grid; grid-template-columns: 56px 1fr 140px 1fr 56px; gap: 12px; align-items: center;
    padding: 9px 0; border-top: 1px solid var(--line); }
  .cmp-row:first-of-type { border-top: 0; }
  .cmp-row .name { text-align: center; color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; }
  .cmp-row .val { font-weight: 650; font-variant-numeric: tabular-nums; }
  .cmp-row .val.r { text-align: right; }
  .track { background: var(--track); border-radius: 3px; height: 8px; overflow: hidden; }
  .track.left { transform: scaleX(-1); }
  .track .fill { height: 100%; width: 0; border-radius: 3px; transition: width .8s cubic-bezier(.2,.8,.3,1); }

  .msg { text-align: center; color: var(--muted); padding: 56px 20px; }

  footer { color: var(--muted); font-size: .82rem; margin-top: 40px; padding-top: 16px;
    border-top: 1px solid var(--line); }
  footer a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--faint); }
  footer a:hover { border-bottom-color: var(--ink); }

  /* ---- loading overlay ---- */
  #loader { position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--ink);
    display: grid; place-items: center; transition: opacity .45s ease; }
  #loader.hide { opacity: 0; pointer-events: none; }
  .loader-inner { width: min(380px, 86vw); }
  .loader-inner .kicker { font-size: .72rem; letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 4px; }
  .loader-inner h2 { font-family: var(--serif); font-weight: 600; font-size: 1.8rem; margin: 0 0 24px; }
  .lstep { display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 11px 0; border-top: 1px solid var(--line); font-size: .92rem; color: var(--muted);
    opacity: .45; transition: opacity .3s ease, color .3s ease; }
  .lstep:first-child { border-top: 0; }
  .lstep.active, .lstep.done { opacity: 1; color: var(--ink); }
  .lstep .status { display: flex; align-items: center; gap: 8px; color: var(--muted);
    font-size: .86rem; font-variant-numeric: tabular-nums; }
  .lstep .check { width: 15px; height: 15px; color: var(--win); opacity: 0; transform: scale(.5);
    transition: opacity .25s ease, transform .25s ease; }
  .lstep.active .check { opacity: 0; }
  .lstep.done .check { opacity: 1; transform: none; }
  .lstep .spin { width: 13px; height: 13px; border: 2px solid var(--line); border-top-color: var(--muted);
    border-radius: 50%; animation: lspin .7s linear infinite; opacity: 0; }
  .lstep.active .spin { opacity: 1; }
  .lstep.done .spin { display: none; }
  @keyframes lspin { to { transform: rotate(360deg); } }
  .lbar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 26px; overflow: hidden; }
  .lbar > span { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 2px; }

  /* ---- theme toggle ---- */
  #theme-toggle {
    position: fixed; bottom: 22px; right: 22px; width: 42px; height: 42px;
    display: grid; place-items: center; border-radius: 999px;
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.12); transition: border-color .15s, transform .15s; }
  #theme-toggle:hover { border-color: var(--muted); transform: translateY(-1px); }
  #theme-toggle svg { width: 19px; height: 19px; }
  #theme-toggle .moon { display: block; }
  #theme-toggle .sun { display: none; }
  [data-theme="dark"] #theme-toggle .moon { display: none; }
  [data-theme="dark"] #theme-toggle .sun { display: block; }

  @media (max-width: 620px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .card:nth-child(-n+4) { border-top: 1px solid var(--line); }
    .card:nth-child(-n+2) { border-top: 0; }
    .card:nth-child(4n+1) { border-left: 1px solid var(--line); }
    .card:nth-child(2n+1) { border-left: 0; }
    .selects { margin-left: 0; }
  }
</style>
<script>
  // Apply saved/preferred theme before first paint to avoid a flash.
  (function () {
    const saved = localStorage.getItem("theme");
    const dark = saved ? saved === "dark"
      : window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.dataset.theme = "dark";
  })();
</script>
</head>
<body>

<div id="loader">
  <div class="loader-inner">
    <p class="kicker">NBA Analytics</p>
    <h2>Season Tracker</h2>
    <div class="lsteps">
      <div class="lstep"><span class="label">League schedule</span>
        <span class="status"><span class="txt" id="ls-season"></span><span class="spin"></span>
          <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></span></div>
      <div class="lstep"><span class="label">Game results</span>
        <span class="status"><span class="txt" id="ls-games"></span><span class="spin"></span>
          <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></span></div>
      <div class="lstep"><span class="label">Team rosters</span>
        <span class="status"><span class="txt" id="ls-teams"></span><span class="spin"></span>
          <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></span></div>
      <div class="lstep"><span class="label">Records &amp; streaks</span>
        <span class="status"><span class="spin"></span>
          <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></span></div>
      <div class="lstep"><span class="label">Charts &amp; comparisons</span>
        <span class="status"><span class="spin"></span>
          <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg></span></div>
    </div>
    <div class="lbar"><span></span></div>
  </div>
</div>

<div class="wrap">
  <header class="masthead">
    <div>
      <p class="kicker">NBA Analytics</p>
      <h1>Season Tracker</h1>
    </div>
    <p class="meta" id="subtitle">Loading…</p>
  </header>

  <div id="app" hidden>
    <div class="controls">
      <div class="tabs" id="tabs">
        <button data-tab="analyze" class="on">Team</button>
        <button data-tab="compare">Compare</button>
      </div>
      <div class="seg" id="phase">
        <button data-phase="all" class="on">Full season</button>
        <button data-phase="regular">Regular</button>
        <button data-phase="playoffs">Playoffs</button>
      </div>
      <div class="selects">
        <select id="teamA"></select>
        <span class="vsmini" id="vsLabel" hidden>vs</span>
        <select id="teamB" hidden></select>
      </div>
    </div>
    <div id="view"></div>
  </div>

  <div class="msg" id="loadError" hidden>
    Couldn't load <code>data.json</code>. Run the pipeline, then serve this folder over HTTP.
  </div>

  <footer>
    Data from the <a href="https://www.balldontlie.io">BALLDONTLIE</a> API.
    Built by <a href="https://div23.app">Divyansh Raghuvanshi</a>.
  </footer>
</div>

<button id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
  <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </svg>
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </svg>
</button>

<script>
"use strict";

let DATA = null;
let state = { tab: "analyze", phase: "all", teamA: null, teamB: null };

const $ = (sel) => document.querySelector(sel);
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

// Dark-mode toggle (theme is pre-applied in <head> to avoid a flash).
$("#theme-toggle").onclick = () => {
  const dark = document.documentElement.dataset.theme === "dark";
  if (dark) delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = "dark";
  localStorage.setItem("theme", dark ? "light" : "dark");
};

/* ------------------------------------------------------------------ */
/* Data helpers                                                       */
/* ------------------------------------------------------------------ */

function phaseGames() {
  if (state.phase === "regular") return DATA.games.filter(g => !g.postseason);
  if (state.phase === "playoffs") return DATA.games.filter(g => g.postseason);
  return DATA.games;
}

// All of one team's games, from that team's point of view.
function teamGames(team) {
  return phaseGames()
    .filter(g => g.home === team || g.away === team)
    .map(g => {
      const home = g.home === team;
      const pts = home ? g.home_score : g.away_score;
      const opp = home ? g.away_score : g.home_score;
      return { date: g.date, opponent: home ? g.away : g.home, home,
               pts, opp, win: pts > opp };
    });
}

function teamStats(team) {
  const gs = teamGames(team);
  const wins = gs.filter(g => g.win).length;
  const losses = gs.length - wins;
  const sum = (arr) => arr.reduce((a, b) => a + b, 0);
  const homeGs = gs.filter(g => g.home), awayGs = gs.filter(g => !g.home);
  let streak = 0, best = 0;
  for (const g of gs) { streak = g.win ? streak + 1 : 0; best = Math.max(best, streak); }
  const last10 = gs.slice(-10);
  return {
    games: gs, wins, losses,
    winPct: gs.length ? wins / gs.length : 0,
    homeW: homeGs.filter(g => g.win).length, homeL: homeGs.filter(g => !g.win).length,
    awayW: awayGs.filter(g => g.win).length, awayL: awayGs.filter(g => !g.win).length,
    ppg: gs.length ? sum(gs.map(g => g.pts)) / gs.length : 0,
    oppg: gs.length ? sum(gs.map(g => g.opp)) / gs.length : 0,
    bestStreak: best,
    last10W: last10.filter(g => g.win).length, last10N: last10.length,
  };
}

function cumulative(gs, pick) {
  let c = 0;
  return gs.map(g => (c += pick(g) ? 1 : 0));
}

/* ------------------------------------------------------------------ */
/* Animation helpers                                                  */
/* ------------------------------------------------------------------ */

function countUp(el, target, decimals = 0, suffix = "") {
  const dur = 800, t0 = performance.now();
  (function tick(t) {
    const k = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - k, 3);
    el.textContent = (target * eased).toFixed(decimals) + suffix;
    if (k < 1) requestAnimationFrame(tick);
  })(t0);
}

function animateLines(container) {
  container.querySelectorAll("path.line").forEach((p, i) => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.getBoundingClientRect();           // force layout so the transition runs
    p.style.transition = `stroke-dashoffset 1.2s ease-out ${i * 0.15}s`;
    p.style.strokeDashoffset = 0;
  });
  container.querySelectorAll("circle.dot").forEach(c => {
    const d = parseFloat(c.dataset.delay || 0);
    setTimeout(() => { c.style.opacity = 1; }, d * 1000);
  });
}

function animateBars(container) {
  container.querySelectorAll("rect.bar").forEach((r, i) => {
    r.style.transitionDelay = Math.min(i * 12, 600) + "ms";
    requestAnimationFrame(() => requestAnimationFrame(() => r.classList.add("grow")));
  });
}

function revealCards(container) {
  container.querySelectorAll(".card").forEach((c, i) => {
    setTimeout(() => c.classList.add("in"), 50 * i);
  });
}

/* ------------------------------------------------------------------ */
/* SVG chart builders                                                 */
/* ------------------------------------------------------------------ */

// Multi-series line chart. series = [{color, values}], x axis = game number.
function lineChartSVG(series) {
  const W = 920, H = 320, P = { l: 40, r: 14, t: 14, b: 30 };
  const maxX = Math.max(2, ...series.map(s => s.values.length));
  const maxY = Math.max(1, ...series.flatMap(s => s.values));
  const x = i => P.l + (W - P.l - P.r) * (i / (maxX - 1));
  const y = v => H - P.b - (H - P.t - P.b) * (v / maxY);

  let out = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  const yStep = Math.max(1, Math.ceil(maxY / 5));
  for (let v = 0; v <= maxY; v += yStep) {
    out += `<line class="grid" x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}"/>` +
           `<text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  }
  const xStep = Math.max(1, Math.ceil(maxX / 10));
  for (let i = 0; i < maxX; i += xStep) {
    out += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${i + 1}</text>`;
  }
  for (const s of series) {
    const pts = s.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    out += `<path class="line" stroke="${s.color}" d="M${pts.join(" L")}"/>`;
    s.values.forEach((v, i) => {
      const delay = 0.15 + 1.2 * (i / s.values.length);
      out += `<circle class="dot" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" fill="${s.color}" data-delay="${delay.toFixed(2)}"/>`;
    });
  }
  return out + "</svg>";
}

// Per-game point margin bars (green = win, red = loss).
function marginChartSVG(gs) {
  const W = 920, H = 240, P = { l: 40, r: 14, t: 14, b: 28 };
  const maxAbs = Math.max(6, ...gs.map(g => Math.abs(g.pts - g.opp)));
  const x = i => P.l + (W - P.l - P.r) * (i / Math.max(1, gs.length));
  const y = v => H - P.b - (H - P.t - P.b) * ((v + maxAbs) / (2 * maxAbs));
  const zero = y(0);
  const bw = Math.max(2, ((W - P.l - P.r) / Math.max(1, gs.length)) - 2);

  let out = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for (const v of [-maxAbs, 0, maxAbs]) {
    out += `<line class="grid" x1="${P.l}" y1="${y(v)}" x2="${W - P.r}" y2="${y(v)}"/>` +
           `<text x="${P.l - 8}" y="${y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${v}</text>`;
  }
  gs.forEach((g, i) => {
    const diff = g.pts - g.opp;
    const top = diff >= 0 ? y(diff) : zero;
    const h = Math.max(1, Math.abs(zero - y(diff)));
    const color = diff >= 0 ? "var(--win)" : "var(--loss)";
    const label = `Game ${i + 1} ${g.home ? "vs" : "@"} ${esc(g.opponent)}: ${g.pts}-${g.opp} (${diff >= 0 ? "+" : ""}${diff})`;
    out += `<rect class="bar" x="${x(i).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1" fill="${color}"><title>${label}</title></rect>`;
  });
  return out + "</svg>";
}

/* ------------------------------------------------------------------ */
/* Views                                                              */
/* ------------------------------------------------------------------ */

function renderAnalyze() {
  const team = state.teamA;
  const s = teamStats(team);
  const view = $("#view");

  if (!s.games.length) {
    view.innerHTML = `<div class="msg">No ${state.phase === "all" ? "" : state.phase + " "}games for ${esc(team)} yet.</div>`;
    return;
  }

  const cards = [
    { k: "Record", v: `${s.wins}-${s.losses}` },
    { k: "Win %", num: s.winPct * 100, dec: 1, suffix: "%" },
    { k: "Home", v: `${s.homeW}-${s.homeL}` },
    { k: "Away", v: `${s.awayW}-${s.awayL}` },
    { k: "Points for / g", num: s.ppg, dec: 1 },
    { k: "Points against / g", num: s.oppg, dec: 1 },
    { k: "Best streak", num: s.bestStreak },
    { k: `Last ${s.last10N}`, v: `${s.last10W}-${s.last10N - s.last10W}` },
  ];

  view.innerHTML = `
    <div class="cards">
      ${cards.map((c, i) => `
        <div class="card"><div class="k">${c.k}</div>
        <div class="v" id="stat${i}">${c.num === undefined ? c.v : "0"}</div></div>`).join("")}
    </div>
    <div class="panel">
      <h2>Cumulative record</h2>
      <p class="note">${esc(team)} wins and losses accumulated game by game.</p>
      <div class="legend">
        <span><i style="background:var(--win)"></i>Wins</span>
        <span><i style="background:var(--loss)"></i>Losses</span>
      </div>
      <div id="lineChart">${lineChartSVG([
        { color: "var(--win)", values: cumulative(s.games, g => g.win) },
        { color: "var(--loss)", values: cumulative(s.games, g => !g.win) },
      ])}</div>
    </div>
    <div class="panel">
      <h2>Point margin by game</h2>
      <p class="note">Final margin for each game. Hover a bar for the box score.</p>
      <div id="marginChart">${marginChartSVG(s.games)}</div>
    </div>`;

  cards.forEach((c, i) => {
    if (c.num !== undefined) countUp($(`#stat${i}`), c.num, c.dec || 0, c.suffix || "");
  });
  revealCards(view);
  animateLines($("#lineChart"));
  animateBars($("#marginChart"));
}

function renderCompare() {
  const [a, b] = [state.teamA, state.teamB];
  const sa = teamStats(a), sb = teamStats(b);
  const view = $("#view");

  if (!sa.games.length || !sb.games.length) {
    view.innerHTML = `<div class="msg">Not enough ${state.phase === "all" ? "" : state.phase + " "}games to compare these teams.</div>`;
    return;
  }

  const rows = [
    { name: "Wins", a: sa.wins, b: sb.wins },
    { name: "Win %", a: sa.winPct * 100, b: sb.winPct * 100, dec: 1, suffix: "%" },
    { name: "Points for", a: sa.ppg, b: sb.ppg, dec: 1 },
    { name: "Points against", a: sa.oppg, b: sb.oppg, dec: 1, lowerBetter: true },
    { name: "Home wins", a: sa.homeW, b: sb.homeW },
    { name: "Away wins", a: sa.awayW, b: sb.awayW },
    { name: "Best streak", a: sa.bestStreak, b: sb.bestStreak },
  ];

  view.innerHTML = `
    <div class="matchup">
      <span class="team p1">${esc(a)}</span>
      <span class="vs">vs</span>
      <span class="team p2">${esc(b)}</span>
    </div>
    <div class="panel">
      <h2>Cumulative wins</h2>
      <p class="note">Which team built its win total faster across the season.</p>
      <div class="legend">
        <span><i style="background:var(--accent)"></i>${esc(a)}</span>
        <span><i style="background:var(--c2)"></i>${esc(b)}</span>
      </div>
      <div id="cmpChart">${lineChartSVG([
        { color: "var(--accent)", values: cumulative(sa.games, g => g.win) },
        { color: "var(--c2)", values: cumulative(sb.games, g => g.win) },
      ])}</div>
    </div>
    <div class="panel">
      <h2>Head to head</h2>
      <p class="note">${esc(a)} at left, ${esc(b)} at right. The darker bar leads each metric.</p>
      ${rows.map((r) => {
        const max = Math.max(r.a, r.b, 0.001);
        const aWins = r.lowerBetter ? r.a <= r.b : r.a >= r.b;
        const fmt = v => v.toFixed(r.dec || 0) + (r.suffix || "");
        return `
        <div class="cmp-row">
          <div class="val" style="color:var(--accent)">${fmt(r.a)}</div>
          <div class="track left"><div class="fill" data-w="${(100 * r.a / max).toFixed(1)}"
               style="background:var(--accent);opacity:${aWins ? 1 : 0.4}"></div></div>
          <div class="name">${r.name}</div>
          <div class="track"><div class="fill" data-w="${(100 * r.b / max).toFixed(1)}"
               style="background:var(--c2);opacity:${aWins ? 0.4 : 1}"></div></div>
          <div class="val r" style="color:var(--c2)">${fmt(r.b)}</div>
        </div>`;
      }).join("")}
    </div>`;

  animateLines($("#cmpChart"));
  view.querySelectorAll(".fill").forEach((f, i) => {
    setTimeout(() => { f.style.width = f.dataset.w + "%"; }, 70 * i + 180);
  });
}

function render() {
  $("#teamB").hidden = $("#vsLabel").hidden = state.tab !== "compare";
  if (state.tab === "compare") renderCompare();
  else renderAnalyze();
}

/* ------------------------------------------------------------------ */
/* Boot                                                               */
/* ------------------------------------------------------------------ */

// Drives the loading overlay: steps tick off one by one over ~2s as the
// progress bar fills, then resolves.
function runLoaderSequence() {
  return new Promise(resolve => {
    const steps = [...document.querySelectorAll(".lstep")];
    const bar = document.querySelector(".lbar > span");
    bar.style.transition = "width 1.9s linear";
    requestAnimationFrame(() => { bar.style.width = "100%"; });

    const per = 1700 / steps.length;
    steps.forEach((s, i) => {
      setTimeout(() => s.classList.add("active"), i * per);
      setTimeout(() => { s.classList.remove("active"); s.classList.add("done"); }, i * per + per * 0.75);
    });
    setTimeout(resolve, 2000);
  });
}

async function boot() {
  const loader = $("#loader");
  try {
    const resp = await fetch("data.json");
    if (!resp.ok) throw new Error(resp.statusText);
    DATA = await resp.json();
  } catch (e) {
    loader.classList.add("hide");
    setTimeout(() => loader.remove(), 450);
    $("#subtitle").textContent = "No data available.";
    $("#loadError").hidden = false;
    return;
  }

  const season = DATA.season;
  const seasonLabel = `${season}–${String(season + 1).slice(-2)}`;
  $("#subtitle").innerHTML =
    `${seasonLabel} season · ${DATA.games.length} games<br>Updated ${DATA.updated}`;
  $("#ls-season").textContent = seasonLabel;
  $("#ls-games").textContent = DATA.games.length.toLocaleString();
  $("#ls-teams").textContent = `${DATA.teams.length} teams`;

  for (const sel of [$("#teamA"), $("#teamB")]) {
    sel.innerHTML = DATA.teams.map(t => `<option>${esc(t)}</option>`).join("");
  }
  state.teamA = DATA.teams.includes("Los Angeles Lakers") ? "Los Angeles Lakers" : DATA.teams[0];
  state.teamB = DATA.teams.find(t => t !== state.teamA);
  $("#teamA").value = state.teamA;
  $("#teamB").value = state.teamB;

  $("#teamA").onchange = e => { state.teamA = e.target.value; render(); };
  $("#teamB").onchange = e => { state.teamB = e.target.value; render(); };
  $("#tabs").onclick = e => {
    const btn = e.target.closest("button"); if (!btn) return;
    state.tab = btn.dataset.tab;
    $("#tabs").querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
    render();
  };
  $("#phase").onclick = e => {
    const btn = e.target.closest("button"); if (!btn) return;
    state.phase = btn.dataset.phase;
    $("#phase").querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
    render();
  };

  await runLoaderSequence();

  $("#app").hidden = false;
  render();                       // chart animations play as the overlay fades
  loader.classList.add("hide");
  setTimeout(() => loader.remove(), 450);
}

boot();
</script>
</body>
